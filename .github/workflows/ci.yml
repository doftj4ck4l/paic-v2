name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Build first: `next build` type-checks and generates .next/types that
      # next-env.d.ts references (missing in a fresh checkout).
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret
      - run: npx tsc --noEmit
