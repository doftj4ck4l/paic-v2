name: Deploy staging (paicv3)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/doftj4ck4l/paic-v2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on the paic server's self-hosted runner. Disable with the repository
  # variable PAIC_DEPLOY=false.
  deploy:
    needs: build
    if: ${{ vars.PAIC_DEPLOY != 'false' }}
    runs-on: [self-hosted, paic]
    steps:
      - name: Pull image, migrate, restart
        run: |
          cd /opt/paicv3
          docker compose pull app
          docker compose run --rm --no-deps app npm run db:migrate
          docker compose up -d app
          docker image prune -f
      - name: Smoke check
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:8502/api/health > /dev/null; then
              echo "paicv3 is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "app did not become healthy — last logs:"
          docker compose -f /opt/paicv3/docker-compose.yml logs --tail 60
          exit 1
