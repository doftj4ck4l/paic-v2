services:
  app:
    image: ghcr.io/doftj4ck4l/paic-v2:latest
    container_name: paicv3
    env_file: .env
    ports:
      - "8502:3000"
    volumes:
      - ./assets:/app/assets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
